<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LFRLMS Fleet Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2313211c'/%3E%3Ctext x='16' y='22' font-size='17' font-weight='700' text-anchor='middle' fill='%23b0874a' font-family='Georgia'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('lfrlms-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/dashboard" aria-label="LFRLMS dashboard">
        <span class="brand-mark">L</span>
        <span class="brand-name">LFRLMS<small>Fleet Console</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="top-tools">
        <div class="db-chip" id="db-chip" title="Database connection"><span class="dot" id="db-dot"></span><span id="db-text">Connecting…</span></div>
        <span class="clock" id="clock"></span>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title" id="page-title">Dashboard</h1>
        <div class="page-sub" id="page-sub"></div>
      </div>
      <div class="page-actions" id="page-actions"></div>
    </div>
    <div id="content"></div>
  </main>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
